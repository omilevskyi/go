---
name: Check code

on: pull_request

permissions:
  contents: read

jobs:
  check-code:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: "false"

      - name: Get modified .go files compared to ${{ github.event.repository.default_branch }} branch
        id: go
        run: |
          set -o pipefail
          if git --no-pager diff --no-color --name-only 'origin/${{ github.event.repository.default_branch }}...HEAD' | grep --silent '\.go$'; then
            echo 'altered=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'altered=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: golangci-lint
        if: steps.go.outputs.altered == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

      - name: Setup Go
        if: steps.go.outputs.altered == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Disable Go telemetry
        if: steps.go.outputs.altered == 'true'
        run: go telemetry off

      - name: Run tests
        if: steps.go.outputs.altered == 'true'
        run: go test -v ./...
