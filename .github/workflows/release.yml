---
name: Publish release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }} # pick PR's HEAD instead of merge commit
          fetch-depth: 0
          persist-credentials: "false"
          show-progress: "false"

      - name: Get last version
        id: last
        run: |
          LAST_VERSION=$(
            git --no-pager tag --no-color --list 'v*' --sort=-version:refname |
            grep --extended-regexp '^v[[:digit:].]+$' |
            head --lines=1
          )
          echo "version=${LAST_VERSION}" >>"${GITHUB_OUTPUT}"

      # Find applications in cmd/ whose Go sources or go.mod files have changed
      # since the last released version and expose them as the "apps" output.
      - name: Get changed applications
        id: changed
        run: |
          APPS=$(
            git --no-pager diff --no-color --name-only "${LAST_VERSION}...HEAD" |
            sed --silent --regexp-extended 's,^cmd/([^/]+).*(\.go|go\.mod)$,\1,p' |
            sort --unique
          )
          echo "apps=${APPS}" >>"${GITHUB_OUTPUT}"
        env:
          LAST_VERSION: ${{ steps.last.outputs.version }}

      - name: Get modified .go files compared to ${{ steps.last.outputs.version }}
        id: go
        run: |
          set -o pipefail
          if [ -n "${APPS}" ] ||
            git --no-pager diff --no-color --name-only "${LAST_VERSION}...HEAD" |
            grep --silent --regexp='\.go$' --regexp='go\.mod$'; then
            echo 'altered=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'altered=false' >>"${GITHUB_OUTPUT}"
          fi
        env:
          APPS: ${{ steps.changed.outputs.apps }}
          LAST_VERSION: ${{ steps.last.outputs.version }}

      - name: Save commit message to file
        id: commit
        if: steps.go.outputs.altered == 'true'
        run: |
          FILE=$(mktemp --tmpdir=${{ runner.temp }})
          git --no-pager log -1 --no-color --pretty=%B >"${FILE}"
          echo "file=${FILE}" >>"${GITHUB_OUTPUT}"

      - name: Verify if commit is conventional
        if: steps.go.outputs.altered == 'true'
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: verify
          args: --ignore-merge-commits --ignore-fixup-commits --file ${{ steps.commit.outputs.file }}

      - name: Remove temporary file
        if: steps.go.outputs.altered == 'true'
        run: rm --force -- "${FILE}"
        env:
          FILE: ${{ steps.commit.outputs.file }}

      - name: Get next version
        id: next
        if: steps.go.outputs.altered == 'true'
        run: |
          NEXT=$(cog bump --auto --dry-run | sed --silent --regexp-extended 's/^v([[:digit:].]+)$/\1/p')
          echo "version=${NEXT}" >>"${GITHUB_OUTPUT}"

      - name: Setup Go
        if: steps.go.outputs.altered == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true
          cache: false

      - name: Disable Go telemetry
        if: steps.go.outputs.altered == 'true'
        run: go telemetry off

      - name: Run tests
        if: steps.go.outputs.altered == 'true'
        run: go test -v ./...

      - name: Push next version
        if: steps.next.outputs.version != ''
        run: |
          git --no-pager config user.name 'Publish Release'
          git --no-pager config user.email 'publish-release@github.com'
          git --no-pager tag --force --annotate "v${NEXT_VERSION}" --message "v${NEXT_VERSION}"
          git --no-pager push --force origin "HEAD:refs/tags/v${NEXT_VERSION}"
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}

      - name: Install Cosign
        if: steps.next.outputs.version != '' && steps.changed.outputs.apps != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Install GoReleaser
        if: steps.next.outputs.version != '' && steps.changed.outputs.apps != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true

      - name: Run GoReleaser
        if: steps.next.outputs.version != '' && steps.changed.outputs.apps != ''
        run: |
          for app in ${APPS}; do
            FILE=".goreleaser/${app}.yml"
            test -f "${FILE}" && goreleaser release --config "${FILE}" --clean
          done
        env:
          APPS: ${{ steps.changed.outputs.apps }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundle(s)
        if: steps.next.outputs.version != '' && steps.changed.outputs.apps != ''
        run: |
          for app in ${APPS}; do
            gh release download "v${NEXT_VERSION}" --pattern "${app}_${NEXT_VERSION}.sha256.sigstore.json"
          done
        env:
          APPS: ${{ steps.changed.outputs.apps }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}

      - name: Verify v${{ steps.next.outputs.version }}
        if: steps.next.outputs.version != '' && steps.changed.outputs.apps != ''
        run: |
          for app in ${APPS}; do
            cosign verify-blob \
              --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --bundle "${app}_${NEXT_VERSION}.sha256.sigstore.json" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${NEXT_VERSION}/${app}_${NEXT_VERSION}.sha256"
          done
        env:
          APPS: ${{ steps.changed.outputs.apps }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
