---
name: Publish release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }} # pick PR's HEAD instead of merge commit
          fetch-depth: 0
          persist-credentials: "false"
          show-progress: "false"

      - name: Get last version
        id: last
        run: |
          LAST_VERSION=$(git --no-pager tag --no-color --list 'v*' --sort=-version:refname |
            grep --extended-regexp '^v[[:digit:].]+$' |
            head --lines=1)
          echo "version=${LAST_VERSION}" | tee --append "${GITHUB_OUTPUT}"

      - name: Get modified .go directories compared to ${{ github.event.repository.default_branch }} branch
        id: go
        run: |
          set -o pipefail
          DIRS=$(git --no-pager diff --no-color --name-only "${GIT_EXPR}" |
            grep --invert-match --regexp='_test\.go$' |
            sed --regexp-extended --silent 's,^(.*)/([^/]+\.go|go\.mod)$,./\1,p' |
            sort --unique | xargs)
          echo "dirs=${DIRS}" | tee --append "${GITHUB_OUTPUT}"
        env:
          GIT_EXPR: "${{ steps.last.outputs.version }}...HEAD"

      - name: Create temporary file
        id: tmp
        run: echo "file=$(mktemp --tmpdir=${RUNNER_TEMP})" | tee --append "${GITHUB_OUTPUT}"

      - name: Save commit message to file
        if: steps.go.outputs.dirs != ''
        run: git --no-pager log -1 --no-color --pretty=%B | tee "${FILE}"
        env:
          FILE: ${{ steps.tmp.outputs.file }}

      - name: Verify if commit is conventional
        if: steps.go.outputs.dirs != ''
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: verify
          args: --ignore-merge-commits --ignore-fixup-commits --file ${{ steps.tmp.outputs.file }}

      - name: Get next version
        id: next
        if: steps.go.outputs.dirs != ''
        run: |
          NEXT_VERSION=$(cog bump --auto --dry-run |
            sed --silent --regexp-extended 's/^v([[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+)$/\1/p')
          echo "version=${NEXT_VERSION}" | tee --append "${GITHUB_OUTPUT}"

      - name: Setup Go
        if: steps.next.outputs.version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true
          cache: false

      - name: Disable Go telemetry
        if: steps.next.outputs.version != ''
        run: go telemetry off

      - name: Get cmd applications list
        if: steps.next.outputs.version != ''
        id: cmd
        run: |
          set -o pipefail
          for cmdir in $(
                go work edit -json | jq --raw-output '.Use[].DiskPath | select(. != ".")' |
                awk --field-separator=/ '{ print NF-1 "\t" $0 }' |
                sort --reverse --numeric-sort | cut --fields=2
              ); do
            for dir in ${DIRS}; do
              dir="${dir}/"
              test "${dir#${cmdir}/}" = "${dir}" || APPS="${APPS}${APPS:+ }${cmdir##*/}"
            done
          done
          echo "apps=${APPS}" | tee --append "${GITHUB_OUTPUT}"
        env:
          DIRS: ${{ steps.go.outputs.dirs }}

      - name: Get push tag flag
        if: ${{ steps.next.outputs.version != '' && steps.cmd.outputs.apps == '' }}
        id: push
        run: |
          set -o pipefail
          MODULE_PATH=$(go mod edit -json | jq --raw-output .Module.Path)
          for pkgdir in $(
                go list ./... | sed --regexp-extended "s,^${MODULE_PATH},.," |
                awk --field-separator=/ '{ print NF-1 "\t" $0 }' |
                sort --reverse --numeric-sort | cut --fields=2
              ); do
            for dir in ${DIRS}; do
              dir="${dir}/"
              test "${dir#${pkgdir}/}" = "${dir}" && continue
              echo tag=true | tee --append "${GITHUB_OUTPUT}"
              exit
            done
          done
          echo tag=false | tee --append "${GITHUB_OUTPUT}"
        env:
          DIRS: ${{ steps.go.outputs.dirs }}

      - name: Push next version ${{ steps.next.outputs.version }}
        if: ${{ steps.cmd.outputs.apps != '' || steps.push.outputs.tag == 'true' }}
        run: |
          git --no-pager config user.name Release
          git --no-pager config user.email release@github.com
          git --no-pager tag --force --annotate "v${NEXT_VERSION}" --message "v${NEXT_VERSION}"
          git --no-pager push --force "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL##*/}/${GITHUB_REPOSITORY}.git" "v${NEXT_VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}

      - name: Get Cosign release version
        id: cosign
        if: steps.cmd.outputs.apps != ''
        run: |
          read -r COSIGN_VERSION < "${GITHUB_WORKSPACE}/.cosign-version"
          echo "version=${COSIGN_VERSION}" | tee --append "${GITHUB_OUTPUT}"

      - name: Install Cosign ${{ steps.cosign.outputs.version }}
        if: steps.cmd.outputs.apps != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}

      - name: Install GoReleaser
        if: steps.cmd.outputs.apps != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true

      - name: Generate .goreleaser.yml
        if: steps.cmd.outputs.apps != ''
        run: |
          cat .goreleaser.yml > "${FILE}"
          echo builds: >> "${FILE}"
          for app in ${APPS}; do
            file=".goreleaser/${app}-build.yml"
            test -f "${file}" || continue
            cat "${file}" >> "${FILE}"
            PRESENT_APPS="${PRESENT_APPS}${PRESENT_APPS:+ }${app}"
          done
          if [ -n "${PRESENT_APPS}" ]; then
            echo archives: >> "${FILE}"
            cat $(printf '.goreleaser/%s-archive.yml ' ${PRESENT_APPS}) >> "${FILE}"
          fi
        env:
          APPS: ${{ steps.cmd.outputs.apps }}
          FILE: ${{ steps.tmp.outputs.file }}

      - name: Run GoReleaser
        if: steps.cmd.outputs.apps != ''
        run: goreleaser release --config "${FILE}" --clean
        env:
          FILE: ${{ steps.tmp.outputs.file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary file
        run: rm --force -- "${FILE}"
        env:
          FILE: ${{ steps.tmp.outputs.file }}

      - name: Download bundle(s)
        if: steps.cmd.outputs.apps != ''
        id: file
        run: |
          CHECKSUM_FILE="CHECKSUM_${NEXT_VERSION}.sha256"
          SIGSTORE_FILE="${CHECKSUM_FILE}.sigstore.json"
          gh release download "v${NEXT_VERSION}" --dir "${RUNNER_TEMP}" --pattern "${SIGSTORE_FILE}"
          echo "checksum=${CHECKSUM_FILE}" | tee --append "${GITHUB_OUTPUT}"
          echo "sigstore=${RUNNER_TEMP}/${SIGSTORE_FILE}" | tee --append "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}

      - name: Verify bundle(s)
        if: steps.cmd.outputs.apps != ''
        run: |
          cosign verify-blob \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle "${SIGSTORE_FILE}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${NEXT_VERSION}/${CHECKSUM_FILE}"
        env:
          CHECKSUM_FILE: ${{ steps.file.outputs.checksum }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          SIGSTORE_FILE: ${{ steps.file.outputs.sigstore }}
